name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libgl1 libdbus-1-3 fonts-noto-color-emoji
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e ".[dev]"
      - name: VieNeu-TTS (without its web UI)
        run: |
          python -m pip install --no-deps "vieneu>=3.8.3,<4"
          python -m pip install -r packaging/vieneu-requirements.txt
      - name: Chromium for Playwright
        run: python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium --no-shell
      # Tests run offline against the cached sample post (no Threads, TTS or Gemini access).
      - run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Static FFmpeg to bundle
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e . pyinstaller
      - name: VieNeu-TTS (without its web UI)
        run: |
          python -m pip install --no-deps "vieneu>=3.8.3,<4"
          python -m pip install -r packaging/vieneu-requirements.txt
      - name: Build
        shell: pwsh
        run: |
          $ff = Split-Path (Get-Command ffmpeg).Source
          if (Test-Path "$env:ChocolateyInstall\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe") { $ff = "$env:ChocolateyInstall\lib\ffmpeg\tools\ffmpeg\bin" }
          python packaging/build.py --ffmpeg-dir "$ff"
      - name: Smoke test the exe
        shell: pwsh
        run: |
          dist\threads2video\threads2video.exe --help
          dist\threads2video\threads2video.exe --download-piper-voice
      - uses: actions/upload-artifact@v4
        with:
          name: threads2video-windows
          path: dist/threads2video-*.zip
