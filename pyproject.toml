[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threads2video"
version = "0.1.0"
description = "Turn a Threads post and its replies into a narrated short video"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "playwright>=1.48",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "edge-tts>=7.0",
    "piper-tts>=1.3",
    "numpy>=1.26",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]
# Full VieNeu-TTS incl. its web UI; the app needs much less, see packaging/vieneu-requirements.txt.
vieneu = ["vieneu>=3.8.3,<4"]

[project.scripts]
threads2video = "threads2video.cli:main"

[project.gui-scripts]
threads2video-gui = "threads2video.gui.app:main"

[tool.setuptools.packages.find]
include = ["threads2video*"]

[tool.setuptools.package-data]
"threads2video.render" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
